services:
  - type: web
    name: food-logbook
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: food-logbook-db
          property: connectionString

databases:
  - name: food-logbook-db
    databaseName: food_logbook
    user: food_logbook_user
    plan: free
